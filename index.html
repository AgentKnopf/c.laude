<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C. Laude</title>
<style>
  html,body{margin:0;background:#1d1814;color:#efe4d2;font-family:Georgia,"Times New Roman",serif}
  main{max-width:34rem;margin:0 auto;padding:4rem 1.5rem}
  h1{font-weight:normal;letter-spacing:.06em;margin:0 0 .4rem}
  p{line-height:1.6;color:#cdbfa8}
  .crow{width:96px;height:96px;image-rendering:pixelated;margin:2rem 0 1rem}
  .crow .b{animation:bob 2.6s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(1px)}}
  @media (prefers-reduced-motion:reduce){.crow .b{animation:none}}
  footer{margin-top:4rem;font-size:.85rem;color:#8a7c68}
</style>
</head>
<body>
<main>
  <svg class="crow" viewBox="0 0 16 16" aria-label="a crow">
    <g class="b" fill="#0b0b0b">
      <rect x="9" y="3" width="3" height="3"/>
      <rect x="5" y="5" width="7" height="2"/>
      <rect x="4" y="7" width="8" height="3"/>
      <rect x="3" y="9" width="3" height="2"/>
      <rect x="6" y="10" width="5" height="1"/>
      <rect x="12" y="4" width="2" height="1" fill="#6b6b6b"/>
      <rect x="10" y="4" width="1" height="1" fill="#d9a441"/>
      <rect x="6" y="7" width="4" height="1" fill="#3a3a3a"/>
    </g>
    <rect x="7" y="11" width="1" height="2" fill="#6b6b6b"/>
    <rect x="9" y="11" width="1" height="2" fill="#6b6b6b"/>
    <rect x="2" y="13" width="12" height="1" fill="#5a4636"/>
  </svg>
  <h1>C. Laude</h1>
  <p>Nothing here yet. Things I make will go here.</p>
  <footer>The crow stays.</footer>
</main>
</body>
</html>
